<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSI & Criminal Trial 2025 — NIC Lookup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#fff}</style>
</head>
<body class="antialiased text-slate-900 font-sans">
<script>
  window.__ENV = {
    REACT_APP_LOOKUP_URL: 'https://your-n8n.example.com/webhook/lookup-nic'
  };
</script>
<div class="min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-3xl">
    <header class="mb-8">
      <div class="rounded-2xl p-6 shadow-sm border border-slate-100">
        <h1 class="text-2xl md:text-3xl font-extrabold">STATE — Law Students' Association of Sri Lanka</h1>
        <p class="mt-2 text-sm text-slate-600">External Affairs · Crime Scene Investigation & Criminal Trial — 2025</p>
        <span class="inline-block mt-3 px-3 py-1 rounded-full bg-gradient-to-r from-rose-300 via-amber-300 to-cyan-300 text-xs font-medium text-white">NIC Lookup</span>
      </div>
    </header>
    <section class="p-6 rounded-xl border shadow-sm bg-white">
      <h2 class="text-lg font-semibold mb-3">Lookup Attendee by NIC</h2>
      <input id="nic" class="mt-1 block w-full rounded-md border px-3 py-2 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-200" placeholder="e.g. 123456789V" />
      <button id="lookup" class="mt-4 w-full rounded-md py-2 font-medium shadow-sm bg-white border border-rose-300 hover:bg-rose-50">Lookup</button>
      <p id="msg" class="mt-3 text-sm text-slate-700"></p>
      <div id="result" class="mt-4 p-3 rounded-md bg-slate-50 border hidden"></div>
    </section>
    <footer class="mt-8 text-center text-xs text-slate-500">
      <p>STATE — Law Students' Association of Sri Lanka · External Affairs</p>
      <p class="mt-1">Event: Crime Scene Investigation & Criminal Trial — 2025</p>
    </footer>
  </main>
</div>
<script>
  const nicInput = document.getElementById('nic');
  const lookupBtn = document.getElementById('lookup');
  const msg = document.getElementById('msg');
  const result = document.getElementById('result');
  const LOOKUP_URL = window.__ENV.REACT_APP_LOOKUP_URL;
  lookupBtn.addEventListener('click', async () => {
    const nic = nicInput.value.trim();
    if(!nic){msg.textContent='Please enter NIC';return;}
    msg.textContent='Checking...'; result.classList.add('hidden');
    try{
      const res = await fetch(LOOKUP_URL+'?nic='+encodeURIComponent(nic));
      const data = await res.json();
      if(data.found){
        result.innerHTML = `<p><b>Name:</b> ${data.name}</p><p><b>NIC:</b> ${data.nic}</p><p><b>Reference:</b> ${data.reference}</p>`;
        result.classList.remove('hidden');
        msg.textContent='Lookup successful';
      } else { msg.textContent='NIC not found'; }
    }catch(err){ msg.textContent='Error: '+err.message; }
  });
</script>
</body>
</html>
